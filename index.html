<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Lớp</title>
<meta name="description" content="Sổ Lớp – lịch dạy, việc cần làm, bài tập và học phí cho giáo viên.">
<meta name="theme-color" content="#2E7D5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Lớp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{--g:#2E7D5B;--bg:#FAF7F2;--ink:#2A2724;--mut:#8A8379;--or:#E07A2F}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  #app{position:fixed;inset:env(safe-area-inset-top) 0 0 0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:var(--bg)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .3s;z-index:2;padding:24px;text-align:center}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 20px rgba(46,125,91,.25)}
  #splash h1{margin:0;font-size:22px}
  #splash p{margin:0;color:var(--mut);font-size:14px;max-width:300px;line-height:1.5}
  .dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--g);opacity:.3;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dn{from{transform:translateY(-20px);opacity:0}}
  @keyframes b{50%{opacity:1;transform:translateY(-3px)}}
  .btn{display:none;margin-top:6px;padding:11px 18px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
  .slow .btn{display:inline-block}
  #install{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:none;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:3;animation:dn .35s ease;font-size:14px;line-height:1.4}
  #install.show{display:flex}
  #install img{width:40px;height:40px;border-radius:10px}
  #install div{flex:1}
  #install button{border:0;background:none;font:inherit;cursor:pointer}
  #install .go{background:var(--g);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600}
  #install .x{color:var(--mut);font-size:20px;padding:0 4px}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <h1>Sổ Lớp</h1>
  <div class="dots"><i></i><i></i><i></i></div>
  <p id="msg">Đang mở sổ lớp của bạn…</p>
  <a class="btn" id="openBtn" target="_blank" rel="noopener">Mở trong trình duyệt</a>
</div>
<iframe id="app" title="Sổ Lớp" allow="clipboard-write; camera; fullscreen"></iframe>
<div id="install"><img src="icon-192.png" alt=""><div id="instTxt"></div><button class="go" id="instGo">Cài đặt</button><button class="x" id="instX" aria-label="Đóng">×</button></div>
<script>
/* ĐƯỜNG DẪN WEB APP (Apps Script → Triển khai → Ứng dụng web, kết thúc bằng /exec) */
const APP_URL = 'https://script.google.com/macros/s/AKfycbxDxgBEL_u2MEdNirTQdRYLir67pjy84CjagdhuepzBwQAdQDwhvri32wEWJmGN9Qrg/exec';

// Chuyển tiếp đường dẫn nộp bài (?nop=...) và vị trí trang (#...) vào ứng dụng
const qs = new URLSearchParams(location.search), nop = qs.get('nop');
const target = APP_URL + (nop ? '?nop=' + encodeURIComponent(nop) : '') + location.hash;
const frame = document.getElementById('app'), splash = document.getElementById('splash');
document.getElementById('openBtn').href = target;
frame.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 600));
setTimeout(() => { if (!splash.classList.contains('hide')) { splash.classList.add('slow'); document.getElementById('msg').textContent = navigator.onLine ? 'Mạng đang chậm. Vui lòng chờ thêm hoặc mở trong trình duyệt.' : 'Không có kết nối mạng. Sổ Lớp cần Internet để đồng bộ dữ liệu.'; } }, 12000);
frame.src = target;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Gợi ý cài đặt (chỉ hiện khi mở bằng trình duyệt, chưa cài)
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const box = document.getElementById('install'), txt = document.getElementById('instTxt'), go = document.getElementById('instGo');
const dismissed = (() => { try { return localStorage.getItem('solop_noinstall') === '1'; } catch (e) { return false; } })();
document.getElementById('instX').onclick = () => { box.classList.remove('show'); try { localStorage.setItem('solop_noinstall', '1'); } catch (e) {} };
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone && !dismissed) { txt.innerHTML = '<b>Cài Sổ Lớp lên điện thoại</b><br>Mở nhanh từ màn hình chính, toàn màn hình.'; box.classList.add('show'); } });
go.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.classList.remove('show'); };
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (iOS && !standalone && !dismissed && !nop) setTimeout(() => { txt.innerHTML = '<b>Cài Sổ Lớp lên iPhone</b><br>Bấm <b>Chia sẻ</b> ⬆︎ rồi chọn <b>Thêm vào MH chính</b>.'; go.style.display = 'none'; box.classList.add('show'); }, 2500);
</script>
</body>
</html>
